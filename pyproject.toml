[build-system]
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "magnet-scout"
version = "0.1.0"
description = "Discover and assess public BitTorrent metadata without downloading payloads"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MagnetScout contributors"}]
keywords = ["bittorrent", "torrent", "magnet", "infohash", "tracker", "metadata"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
]
dependencies = [
  "bencode.py>=4.1,<5",
  "click>=8.2,<8.3",
  "defusedxml>=0.7.1,<1",
  "httpx>=0.27,<1",
  "typer>=0.20,<0.21",
  "torf>=4.3.1,<5",
]

[project.optional-dependencies]
dht = ["pythontorrentdht>=1.0.3,<2"]
dev = [
  "bandit>=1.9,<2",
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pip-audit>=2.10,<3",
  "ruff>=0.11",
  "twine>=6.1,<7",
  "types-defusedxml>=0.7.0.20240218",
]

[project.urls]
Homepage = "https://github.com/monhoney/magnet-scout"
Repository = "https://github.com/monhoney/magnet-scout"
Issues = "https://github.com/monhoney/magnet-scout/issues"

[project.scripts]
magnet-scout = "magnet_scout.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/magnet_scout"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/magnet_scout", "scripts"]
